<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NEU TICKETS</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--navy:#06243b;--green:#8cc63f;--bg:#f3f4f6;--text:#111827;--line:#e5e7eb}
*{box-sizing:border-box}body{margin:0;padding:14px;font-family:-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif;background:var(--bg);color:var(--text)}
header{background:var(--navy);color:white;margin:-14px -14px 10px;padding:18px 14px;border-radius:0 0 22px 22px;box-shadow:0 2px 12px #0002}
.logoRow{display:flex;gap:12px;align-items:center}.logo{width:74px;height:74px;border-radius:16px;object-fit:cover;background:white}
h1{font-size:24px;margin:0}h2{font-size:18px;margin:0 0 10px}h3{font-size:16px;margin:12px 0 8px}
.card{background:white;border-radius:18px;padding:14px;margin:12px 0;box-shadow:0 1px 8px #0001}
label{font-weight:700;font-size:14px;display:block;margin-top:10px}
input,select,textarea,button{width:100%;font-size:16px;padding:12px;border-radius:12px;border:1px solid #d1d5db;margin-top:6px;background:white}
textarea{min-height:80px}button{background:var(--navy);color:white;border:0;font-weight:800}
.green{background:var(--green)!important;color:#061826!important}.gray{background:#e5e7eb!important;color:#111827!important}.red{background:#b91c1c!important;color:white!important}
.topNav{position:sticky;top:0;z-index:999;background:#f3f4f6;padding:8px 0;display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.topNav button{font-size:13px;padding:10px 4px;border-radius:14px;border:0;background:#e5e7eb;color:#111827;font-weight:800}
.topNav button.active{background:var(--navy);color:white}.page{display:none}.page.active{display:block}
.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}.small{font-size:13px;color:#6b7280}
.badge{display:inline-block;background:#e5e7eb;border-radius:999px;padding:3px 8px;font-size:12px;font-weight:700;margin:2px}
.inspectHalo{background:#dbeafe;color:#1e40af}.inspectNotReady{background:#fee2e2;color:#991b1b}.inspectPartial{background:#fef3c7;color:#92400e}.inspectFinal{background:#dcfce7;color:#166534}.grayBadge{background:#e5e7eb;color:#374151}
.ticketCard,.folderCard{background:white;border:1px solid var(--line);border-radius:16px;padding:12px;margin-top:10px}
.ticketTitle,.folderName{font-weight:900;font-size:16px}.folderGrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.folderIcon{font-size:30px}.folderCount{font-size:12px;color:#6b7280;margin-top:4px}
.mini{width:auto!important;padding:7px 10px!important;font-size:12px!important;border-radius:999px!important;margin:6px 4px 0 0!important}
.info{background:#f9fafb;border:1px solid #e5e7eb;border-radius:12px;padding:10px;margin-top:8px}
.notice{background:#ecfdf5;color:#065f46;padding:10px;border-radius:12px;margin:8px 0;font-weight:700}.bad{background:#fee2e2;color:#991b1b;padding:10px;border-radius:12px;margin:8px 0;font-weight:700}
.hidden{display:none!important}.authPage{min-height:70vh;display:grid;place-items:center}.authCard{background:white;padding:20px;border-radius:20px;width:100%;max-width:440px;box-shadow:0 2px 20px #0001;text-align:center}.authLogo{width:96px;border-radius:18px}
.pinInput{font-size:32px!important;text-align:center;letter-spacing:14px;font-weight:900}.materialGrid{display:grid;grid-template-columns:1fr 88px;gap:8px;align-items:end;margin-top:8px;padding:8px;border:1px solid #e5e7eb;border-radius:12px;background:#fafafa}.materialNumber{font-weight:900;color:#6b7280;font-size:12px;margin-bottom:4px}
.drivePill{display:inline-block;background:#ecfdf5;color:#065f46;border:1px solid #a7f3d0;border-radius:999px;padding:7px 10px;font-size:12px;font-weight:800;margin:5px 5px 0 0;text-decoration:none}
</style>
</head>

<label>Inspection Status</label><select id="editInspection"><option>Ready for Halo Inspection</option><option>Inspection Not Ready</option><option>Inspection Not Needed</option><option>Ready for Partial Inspection</option><option>Ready for Final Inspection</option></select>
<label>Notes</label><textarea id="editNotes"></textarea>
<label>Need to Complete</label><textarea id="editNeed"></textarea>
<button class="green" id="saveEditBtn">Save Changes</button>
</div>
</div></section>
<section id="foldersPage" class="page"><div class="card"><button class="mini gray hidden" id="folderBackBtn">← Back</button><h2 id="folderTitle">Folders</h2><label>Create Folder Here</label><input id="folderName"><button id="createFolderBtn" class="green">Save Folder</button><div id="foldersGrid" class="folderGrid"></div></div><div class="card"><h2>Tickets Here</h2><div id="folderTickets"></div></div></section>
<section id="inventoryPage" class="page"><div class="card"><h2>My Inventory</h2><label>Material Name</label><input id="invName"><div class="row"><div><label>Quantity</label><input id="invQty" type="number"></div><div><label>Unit</label><input id="invUnit"></div></div><label>Low Alert Qty</label><input id="invLow" type="number"><button id="addInvBtn">Save Material</button></div><div class="card"><h2>Inventory List</h2><div id="inventoryList"></div></div></section>
<section id="materialsPage" class="page"><div class="card"><h2>Materials Used</h2><div id="materialsUsedList"></div></div></section>
<section id="drivePage" class="page"><div class="card"><h2>Google Drive Links</h2><label>Ticket</label><select id="driveTicket"></select><label>Label</label><input id="driveLabel"><label>Drive Link</label><textarea id="driveUrl"></textarea><button id="addDriveBtn" class="green">Attach Drive Link</button></div><div class="card"><h2>Attached Links</h2><div id="driveList"></div></div></section>
<section id="settingsPage" class="page"><div class="card"><h2>Settings</h2><p id="signedInAs" class="small"></p><div id="adminPanel" class="hidden"><h3>Admin: Employees</h3><label>Employee Name</label><input id="empName"><label>4-Digit PIN</label><input id="empPin" maxlength="4" inputmode="numeric"><button id="addEmployeeBtn" class="green">Add Employee</button><div id="employeeList"></div></div><button id="shareBtn" class="gray">Share App Link</button><button id="signOutBtn" class="red">Sign Out</button></div></section>
</div>
<script>
let supabaseClient=null,currentEmployee=null,currentFolder=null,selectedTicket=null,createMaterialLineCount=10;
let data={employees:[],folders:[],tickets:[],inventory:[],used:[],drive:[]};
function $(id){return document.getElementById(id)}function show(x){x.classList.remove("hidden")}function hide(x){x.classList.add("hidden")}
function notice(m){$("noticeBox").textContent=m;show($("noticeBox"));setTimeout(()=>hide($("noticeBox")),3000)}function error(m){$("errorBox").textContent=m;show($("errorBox"));window.scrollTo(0,0)}
function today(){return new Date().toISOString().slice(0,10)}function displayDate(iso){if(!iso)return"";let p=iso.split("-");return p.length===3?p[1]+"/"+p[2]+"/"+p[0]:iso}
function inspectClass(s){if(s==="Ready for Halo Inspection")return"inspectHalo";if(s==="Inspection Not Needed")return"grayBadge";if(s==="Ready for Partial Inspection")return"inspectPartial";if(s==="Ready for Final Inspection")return"inspectFinal";return"inspectNotReady"}
function cfg(){return JSON.parse(localStorage.getItem("neu_pin_supabase")||"null")}function saveCfg(url,key){localStorage.setItem("neu_pin_supabase",JSON.stringify({url,key}))}function ticket(id){return data.tickets.find(t=>t.id===id)}function folderPath(id){let arr=[],f=data.folders.find(x=>x.id===id);while(f){arr.unshift(f.name);f=data.folders.find(x=>x.id===f.parent_id)}return arr.join(" / ")}
async function init(){$("newDate").value=today();let c=cfg(), saved=localStorage.getItem("neu_current_employee");if(!c||!c.url||!c.key){show($("setupPage"));return}supabaseClient=window.supabase.createClient(c.url,c.key);if(saved){currentEmployee=JSON.parse(saved);showApp()} else show($("pinPage"))}
async function pinLogin(){let pin=$("pinInput").value.trim();if(pin.length!==4)return error("Enter 4 digit PIN.");let r=await supabaseClient.from("employees").select("*").eq("pin",pin).eq("active",true).maybeSingle();if(r.error)return error(r.error.message);if(!r.data)return error("PIN not found.");currentEmployee=r.data;localStorage.setItem("neu_current_employee",JSON.stringify(currentEmployee));showApp()}
async function showApp(){hide($("setupPage"));hide($("pinPage"));show($("appPage"));$("signedInAs").textContent="Signed in as "+currentEmployee.name;await loadAll()}
async function loadAll(){let [e,f,t,i,u,d]=await Promise.all([supabaseClient.from("employees").select("*").order("name"),supabaseClient.from("folders").select("*").order("name"),supabaseClient.from("tickets").select("*").order("created_at",{ascending:false}),supabaseClient.from("employee_inventory").select("*").eq("employee_id",currentEmployee.id).order("name"),supabaseClient.from("ticket_materials").select("*").order("created_at",{ascending:false}),supabaseClient.from("drive_links").select("*").order("created_at",{ascending:false})]);if(f.error)return error(f.error.message);data.employees=e.data||[];data.folders=f.data||[];data.tickets=t.data||[];data.inventory=i.data||[];data.used=u.data||[];data.drive=d.data||[];draw();ensureInspectionNotNeeded()}
function showPage(p){document.querySelectorAll(".page").forEach(x=>x.classList.remove("active"));$(p).classList.add("active");document.querySelectorAll(".topNav button").forEach(b=>b.classList.remove("active"));document.querySelector(`[data-page="${p}"]`).classList.add("active");draw();ensureInspectionNotNeeded()}
function renderCreateMaterials(){let out="";for(let i=1;i<=createMaterialLineCount;i++)out+=`<div class="materialGrid"><div><div class="materialNumber">Material ${i}</div><input id="newMatName${i}" list="materialOptions" placeholder="Start typing material"></div><div><div class="materialNumber">Qty</div><input id="newMatQty${i}" type="number" placeholder="0"></div></div>`;$("createMaterialsList").innerHTML=out}function addCreateMaterialLine(){createMaterialLineCount++;renderCreateMaterials()}

function editTicket(id){
 selectedTicket=data.tickets.find(t=>String(t.id)===String(id));
 if(!selectedTicket)return error("Could not edit ticket. Refresh and try again.");
 hide($("ticketListView"));
 hide($("ticketDetailView"));
 show($("ticketEditView"));
 $("editBuilder").value=selectedTicket.builder||"";
 $("editJobAddress").value=selectedTicket.job_address||"";
 $("editDate").value=selectedTicket.ticket_date||today();
 $("editFolder").innerHTML='<option value="">General</option>'+data.folders.map(f=>`<option value="${f.id}">${folderPath(f.id)}</option>`).join("");
 $("editFolder").value=selectedTicket.folder_id||"";
 $("editInspection").value=selectedTicket.inspection_status||"Inspection Not Ready";
 $("editNotes").value=selectedTicket.notes||"";
 $("editNeed").value=selectedTicket.need_to_complete||"";
 window.scrollTo(0,0);
}
async function saveEdit(){
 if(!selectedTicket)return error("No ticket selected.");
 let upd={
  builder:$("editBuilder").value.trim(),
  job_address:$("editJobAddress").value.trim(),
  ticket_date:$("editDate").value||today(),
  folder_id:$("editFolder").value||null,
  inspection_status:$("editInspection").value,
  notes:$("editNotes").value,
  need_to_complete:$("editNeed").value
 };
 let r=await supabaseClient.from("tickets").update(upd).eq("id",selectedTicket.id);
 if(r.error)return error(r.error.message);
 notice("Ticket updated.");
 selectedTicket={...selectedTicket,...upd};
 hide($("ticketEditView"));
 show($("ticketDetailView"));
 await loadAll();
 openTicket(selectedTicket.id);
}
function openPhotos(id){
 let links=data.drive.filter(d=>d.ticket_id===id);
 if(links.length){
  window.open(links[0].url,"_blank");
  return;
 }
 showPage("drivePage");
 $("driveTicket").value=id;
 notice("Add a Google Drive photo link for this ticket.");
}

async function createTicket(){let row={builder:$("newBuilder").value.trim(),job_address:$("newJobAddress").value.trim(),ticket_date:$("newDate").value||today(),folder_id:$("newFolder").value||null,inspection_status:$("newInspection").value,notes:$("newNotes").value,need_to_complete:$("newNeed").value,created_by_name:currentEmployee.name};let r=await supabaseClient.from("tickets").insert(row).select().single();if(r.error)return error(r.error.message);let ticketId=r.data.id;for(let i=1;i<=createMaterialLineCount;i++){let name=($("newMatName"+i)?.value||"").trim(), qty=Number($("newMatQty"+i)?.value||0);if(!name||!qty)continue;let item=data.inventory.find(x=>x.name.toLowerCase()===name.toLowerCase());if(!item)continue;await supabaseClient.from("ticket_materials").insert({ticket_id:ticketId,inventory_id:item.id,material_name:item.name,unit:item.unit,quantity:qty,employee_id:currentEmployee.id,employee_name:currentEmployee.name});await supabaseClient.from("employee_inventory").update({quantity:Number(item.quantity)-qty}).eq("id",item.id)}["newBuilder","newJobAddress","newNotes","newNeed"].forEach(id=>$(id).value="");createMaterialLineCount=10;renderCreateMaterials();notice("Ticket created.");loadAll()}
function openTicket(id){
 selectedTicket=data.tickets.find(t=>String(t.id)===String(id));
 if(!selectedTicket){ return error("Could not open ticket. Refresh and try again."); }
 hide($("ticketListView"));
 show($("ticketDetailView"));
 drawTicketDetail();
 window.scrollTo(0,0);
}
function backTickets(){selectedTicket=null;hide($("ticketDetailView"));if($("ticketEditView"))hide($("ticketEditView"));show($("ticketListView"));draw();ensureInspectionNotNeeded()}
async function createFolder(){let n=$("folderName").value.trim();if(!n)return error("Enter folder name.");let r=await supabaseClient.from("folders").insert({name:n,parent_id:currentFolder});if(r.error)return error(r.error.message);$("folderName").value="";notice("Folder saved.");loadAll()}
async function deleteFolder(id){if(!confirm("Delete folder?"))return;await supabaseClient.from("tickets").update({folder_id:null}).eq("folder_id",id);let r=await supabaseClient.from("folders").delete().eq("id",id);if(r.error)return error(r.error.message);loadAll()}
async function addInventory(){let name=$("invName").value.trim();if(!name)return error("Enter material name.");let r=await supabaseClient.from("employee_inventory").insert({employee_id:currentEmployee.id,name,quantity:Number($("invQty").value||0),unit:$("invUnit").value,low_alert_qty:Number($("invLow").value||0)});if(r.error)return error(r.error.message);["invName","invQty","invUnit","invLow"].forEach(id=>$(id).value="");notice("Material saved.");loadAll()}
async function deleteInventory(id){if(!confirm("Delete this material?"))return;let r=await supabaseClient.from("employee_inventory").delete().eq("id",id);if(r.error)return error(r.error.message);notice("Material deleted.");loadAll()}
async function addDrive(){let r=await supabaseClient.from("drive_links").insert({ticket_id:$("driveTicket").value,label:$("driveLabel").value,url:$("driveUrl").value});if(r.error)return error(r.error.message);$("driveLabel").value="";$("driveUrl").value="";loadAll()}
async function addEmployee(){if(!currentEmployee.is_admin)return error("Admin only.");let name=$("empName").value.trim(),pin=$("empPin").value.trim();if(!name||pin.length!==4)return error("Enter name and 4 digit PIN.");let r=await supabaseClient.from("employees").insert({name,pin,active:true,is_admin:false});if(r.error)return error(r.error.message);$("empName").value="";$("empPin").value="";loadAll()}
function emailTicket(id){let t=ticket(id),used=data.used.filter(u=>u.ticket_id===id),links=data.drive.filter(d=>d.ticket_id===id);let body=`NEU ELECTRICAL SOLUTIONS\n\nBuilder: ${t.builder||""}\nCreated By: ${t.created_by_name||"Team"}\nAddress: ${t.job_address||""}\nDate: ${displayDate(t.ticket_date)}\nInspection: ${t.inspection_status||""}\n\nNotes:\n${t.notes||""}\n\nMaterials:\n`;used.forEach(u=>body+=`- ${u.material_name} - ${u.quantity} ${u.unit||""}\n`);body+=`\nNeed to Complete:\n${t.need_to_complete||""}\n\nDrive Links:\n`;links.forEach(l=>body+=`- ${l.label||"Drive"}: ${l.url}\n`);location.href="mailto:?subject="+encodeURIComponent("NEU TICKETS - "+(t.builder||"Ticket"))+"&body="+encodeURIComponent(body)}

function ensureInspectionNotNeeded(){
 document.querySelectorAll("select").forEach(sel=>{
  const values=[...sel.options].map(o=>o.textContent.trim());
  if(values.includes("Inspection Not Ready") && values.includes("Ready for Partial Inspection") && !values.includes("Inspection Not Needed")){
   const opt=document.createElement("option");
   opt.textContent="Inspection Not Needed";
   opt.value="Inspection Not Needed";
   const partial=[...sel.options].find(o=>o.textContent.trim()==="Ready for Partial Inspection");
   sel.insertBefore(opt, partial || null);
  }
 });
}

function ticketCard(t){let count=data.used.filter(u=>u.ticket_id===t.id).length;let photoCount=data.drive.filter(d=>d.ticket_id===t.id).length;return `<div class="ticketCard"><div class="ticketTitle">${t.builder||"No Builder"}</div><div class="small">${displayDate(t.ticket_date)} • ${t.job_address||"No address"}<br>Created By: ${t.created_by_name||"Team"}</div><span class="badge ${inspectClass(t.inspection_status)}">${t.inspection_status||"Inspection Not Ready"}</span><span class="badge">${count} material line(s)</span><span class="badge">${photoCount} photo link(s)</span><br><button class="mini green" data-open-ticket="${t.id}">Open</button><button class="mini gray" data-edit-ticket="${t.id}">Edit</button><button class="mini gray" data-photos-ticket="${t.id}">Photos</button><button class="mini gray" data-email-ticket="${t.id}">Email</button></div>`}
function drawTicketDetail(){let t=selectedTicket;if(!t)return error("Ticket not found.");let used=data.used.filter(u=>u.ticket_id===t.id),links=data.drive.filter(d=>d.ticket_id===t.id);$("ticketDetail").innerHTML=`<h2>${t.builder||"Ticket"}</h2><div class="info"><b>Builder</b><br>${t.builder||""}</div><div class="info"><b>Created By</b><br>${t.created_by_name||"Team"}</div><div class="info"><b>Job Address</b><br>${t.job_address||""}</div><div class="info"><b>Date</b><br>${displayDate(t.ticket_date)}</div><div class="info"><b>Inspection</b><br><span class="badge ${inspectClass(t.inspection_status)}">${t.inspection_status||""}</span></div><div class="info"><b>Notes</b><br>${t.notes||""}</div><div class="info"><b>Materials Used</b><br>${used.length?used.map(u=>u.material_name+" - "+u.quantity+" "+(u.unit||"")).join("<br>"):"No materials."}</div><div class="info"><b>Need to Complete</b><br>${t.need_to_complete||""}</div><div class="info"><b>Photos / Drive Links</b><br>${links.length?links.map(l=>`<a class="drivePill" href="${l.url}" target="_blank">${l.label||"Open Photos"}</a>`).join(""):"No photo links yet."}</div><button class="green" onclick="editTicket('${t.id}')">Edit</button><button class="gray" onclick="openPhotos('${t.id}')">Photos</button><button class="gray" onclick="emailTicket('${t.id}')">Email</button>`}
function draw(){let folderOpts='<option value="">General</option>'+data.folders.map(f=>`<option value="${f.id}">${folderPath(f.id)}</option>`).join("");$("newFolder").innerHTML=folderOpts;$("driveTicket").innerHTML='<option value="">Pick Ticket</option>'+data.tickets.map(t=>`<option value="${t.id}">${t.builder||"Ticket"}</option>`).join("");$("materialOptions").innerHTML=data.inventory.map(i=>`<option value="${i.name}"></option>`).join("");$("ticketsList").innerHTML=data.tickets.length?data.tickets.map(ticketCard).join(""):'<p class="small">No tickets yet.</p>';let visible=data.folders.filter(f=>(f.parent_id||null)===(currentFolder||null));$("folderBackBtn").classList.toggle("hidden",!currentFolder);$("folderTitle").textContent=currentFolder?folderPath(currentFolder):"Folders";$("foldersGrid").innerHTML=visible.length?visible.map(f=>`<div class="folderCard" onclick="currentFolder='${f.id}';draw()"><div class="folderIcon">📁</div><div class="folderName">${f.name}</div><div class="folderCount">${data.tickets.filter(t=>t.folder_id===f.id).length} ticket(s)</div><button class="mini red" onclick="event.stopPropagation();deleteFolder('${f.id}')">Delete</button></div>`).join(""):'<p class="small">No folders here.</p>';let ft=data.tickets.filter(t=>(t.folder_id||null)===(currentFolder||null));$("folderTickets").innerHTML=ft.length?ft.map(ticketCard).join(""):'<p class="small">No tickets in this folder.</p>';$("inventoryList").innerHTML=data.inventory.length?data.inventory.map(i=>`<div class="ticketCard"><b>${i.name}</b><br>${i.quantity} ${i.unit||""}<br><button class="mini red" onclick="deleteInventory('${i.id}')">Delete</button></div>`).join(""):'<p class="small">No inventory yet.</p>';$("materialsUsedList").innerHTML=data.used.length?data.used.map(u=>`<p><b>${ticket(u.ticket_id)?.builder||"Ticket"}</b><br>${u.material_name} - ${u.quantity} ${u.unit||""}<br><span class="small">${u.employee_name||""}</span></p>`).join(""):'<p class="small">No materials used yet.</p>';$("driveList").innerHTML=data.drive.length?data.drive.map(d=>`<p><b>${d.label||"Drive Link"}</b><br><a href="${d.url}" target="_blank">${d.url}</a></p>`).join(""):'<p class="small">No Drive links yet.</p>';$("adminPanel").classList.toggle("hidden",!currentEmployee.is_admin);$("employeeList").innerHTML=data.employees.map(e=>`<p><b>${e.name}</b> — PIN ${e.pin} ${e.is_admin?"(Admin)":""}</p>`).join("");if(selectedTicket)drawTicketDetail()}
$("saveSetupBtn").onclick=()=>{saveCfg($("setupUrl").value.trim(),$("setupKey").value.trim());location.reload()};$("clearSetupBtn").onclick=()=>{localStorage.removeItem("neu_pin_supabase");location.reload()};$("pinLoginBtn").onclick=pinLogin;$("pinInput").addEventListener("keyup",e=>{if(e.key==="Enter"||$("pinInput").value.length===4)pinLogin()});$("signOutBtn").onclick=()=>{localStorage.removeItem("neu_current_employee");location.reload()};$("shareBtn").onclick=()=>{if(navigator.share)navigator.share({title:"NEU TICKETS",url:location.href});else prompt("Copy app link:",location.href)};document.body.addEventListener("click",e=>{
 let p=e.target.dataset.page;
 if(p) return showPage(p);
 let openId=e.target.dataset.openTicket;
 if(openId) return openTicket(openId);
 let editId=e.target.dataset.editTicket;
 if(editId) return editTicket(editId);
 let photoId=e.target.dataset.photosTicket;
 if(photoId) return openPhotos(photoId);
 let emailId=e.target.dataset.emailTicket;
 if(emailId) return emailTicket(emailId);
});$("createTicketBtn").onclick=createTicket;$("backTicketsBtn").onclick=backTickets;if($("backEditBtn"))$("backEditBtn").onclick=backTickets;if($("saveEditBtn"))$("saveEditBtn").onclick=saveEdit;$("createFolderBtn").onclick=createFolder;$("folderBackBtn").onclick=()=>{currentFolder=data.folders.find(f=>f.id===currentFolder)?.parent_id||null;draw();ensureInspectionNotNeeded()};$("addInvBtn").onclick=addInventory;$("addDriveBtn").onclick=addDrive;$("addEmployeeBtn").onclick=addEmployee;$("addCreateMaterialLineBtn").onclick=addCreateMaterialLine;renderCreateMaterials();ensureInspectionNotNeeded();init();
</script>
</body>
</html>
